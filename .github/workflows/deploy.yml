name: Build and publish to nostia-page-landing

# This repo is the PRIVATE source. It builds the site and pushes the build
# output into olafw666-cpu/nostia-page-landing, which is public and is what
# GitHub Pages actually serves.
#
# Why the deploy target stayed public rather than moving here: Pages on a private
# repo needs a paid plan, and — more importantly — nostia.io's A records and the
# verified custom domain are already attached to that repo. Moving the public
# side would have meant a DNS change and a re-verification window; moving the
# private side costs nothing user-facing.
#
# Auth is an ed25519 DEPLOY KEY (secret PAGES_DEPLOY_KEY), not a personal access
# token. A deploy key is scoped to exactly one repository, so a leak cannot touch
# anything else in the org — a PAT with `repo` scope could rewrite every repo the
# author can see.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-nostia-io
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Gate the deploy on the console's contract tests. A red suite must not
      # reach nostia.io — this is the only automated check between a commit and
      # production.
      - name: Console contract smoke
        run: npm run smoke

      - name: Build
        run: npm run build

      # The custom domain rides in build/CNAME (public/CNAME -> build/CNAME).
      # Publishing without it silently drops nostia.io back to the
      # *.github.io default and takes the site down.
      - name: Verify build output
        run: |
          test -f build/CNAME || { echo "::error::build/CNAME missing — publishing would drop the custom domain"; exit 1; }
          test -f build/index.html || { echo "::error::build/index.html missing"; exit 1; }
          test -f build/console/index.html || { echo "::error::console missing from build"; exit 1; }
          test -f build/.well-known/apple-app-site-association || { echo "::error::AASA missing — passkeys and universal links would break"; exit 1; }
          test -f build/Nostia-orgs-deck.pdf || { echo "::error::Nostia-orgs-deck.pdf missing — the Investor Deck link in the header, footer and /contact would 404. Export the deck to public/Nostia-orgs-deck.pdf"; exit 1; }
          echo "build output verified: $(find build -type f | wc -l) files"

      - name: Publish to the public deploy repo
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 git@github.com:olafw666-cpu/nostia-page-landing.git out

          # Replace the tree wholesale so deleted files actually disappear.
          # -mindepth 1 keeps `out` itself; -not -name .git keeps the history,
          # which is the rollback path if a publish goes wrong.
          find out -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +

          # `build/.` (not `build/*`) so dotfiles come too — .well-known/ is a
          # dotfolder, and a glob would silently leave the AASA behind.
          cp -a build/. out/

          cd out
          git config user.name  "nostia-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no change in build output — nothing to publish"
          else
            git commit -m "Publish ${GITHUB_SHA::7} from nostia-landing-source"
            git push
            echo "published"
          fi
